# Network Change Service — Application Properties
spring.application.name=network-change-service

# Change service configuration
telecom.change.remote.enabled=false
telecom.change.max-retry-count=3
telecom.change.default-region=default
telecom.change.plugin-class-name=com.example.telecom.change.plugin.BenchmarkChangeValidationPlugin

# JPA / Hibernate (only active when tests use real JPA context)
spring.jpa.open-in-view=false
